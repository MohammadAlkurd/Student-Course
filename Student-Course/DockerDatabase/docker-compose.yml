services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    network_mode: host
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "123@four"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
volumes:
  mssql_data:
